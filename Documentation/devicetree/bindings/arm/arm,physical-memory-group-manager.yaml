%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/arm,physical-memory-group-manager.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm physical memory group manager for Mali GPU device drivers

description: |
  Binding for the physical memory group manager referenced by the GPU via the
  "physical-memory-group-manager" phandle property. :contentReference[oaicite:87]{index=87}

maintainers:
  - Arm Ltd.

properties:
  compatible:
    const: arm,physical-memory-group-manager  # :contentReference[oaicite:88]{index=88}

required:
  - compatible

additionalProperties: true

examples:
  - |
    gpu_physical_memory_group_manager: physical-memory-group-manager {
      compatible = "arm,physical-memory-group-manager";
    };
...
