%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/arm,priority-control-manager.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm priority control manager for Mali GPU device drivers

description: |
  Binding for the priority control manager referenced by the GPU via the
  "priority-control-manager" phandle property. :contentReference[oaicite:89]{index=89}

maintainers:
  - Arm Ltd.

properties:
  compatible:
    const: arm,priority-control-manager  # :contentReference[oaicite:90]{index=90}

required:
  - compatible

additionalProperties: true

examples:
  - |
    gpu_priority_control_manager: priority-control-manager {
      compatible = "arm,priority-control-manager";
    };
...
