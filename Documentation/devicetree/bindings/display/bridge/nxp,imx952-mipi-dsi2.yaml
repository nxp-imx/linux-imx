%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/nxp,imx952-mipi-dsi2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX952 specific extensions to Synopsys Designware MIPI DSI2

maintainers:
  - Liu Ying <victor.liu@nxp.com>

allOf:
  - $ref: /schemas/display/dsi-controller.yaml#

properties:
  compatible:
    const: nxp,imx952-mipi-dsi2

  reg:
    maxItems: 1

  clocks:
    maxItems: 5

  clock-names:
    items:
      - const: bypass
      - const: pclk
      - const: sys
      - const: pix
      - const: phy_pll

  mux-controls:
    maxItems: 1
    description:
      mux controller node to use for operating the input mux

  power-domains:
    maxItems: 1

  nxp,disp-dsi-csr:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      i.MX952 display DSI CSR, as a syscon, includes control and status
      registers which provide top-level control of peripheral functionalities
      within the Display domain, including the MIPI DSI host, DSI PHY and DSI
      PLL.

  phys:
    maxItems: 1

  phy-names:
    const: dphy

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input node to receive pixel data.

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: DSI output node to panel or bridge.

    required:
      - port@0
      - port@1

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    dsi@4b060000 {
      compatible = "nxp,imx952-mipi-dsi2";
      reg = <0x4b060000 0x10000>;
      clocks = <&scmi_clk 67>,
               <&scmi_clk 190>,
               <&scmi_clk 80>,
               <&scmi_clk 80>,
               <&mipi_dphy>;
      clock-names = "bypass", "pclk", "sys", "pix", "phy_pll";
      mux-controls = <&mux 0>;
      power-domains = <&scmi_devpd 11>;
      nxp,disp-dsi-csr = <&display_dsi_csr>;
      phys = <&mipi_dphy>;
      phy-names = "dphy";
      #address-cells = <1>;
      #size-cells = <0>;

      panel@0 {
        compatible = "raydium,rm67191";
        reg = <0>;
        reset-gpios = <&adp5585gpio 6 GPIO_ACTIVE_LOW>;
        dsi-lanes = <4>;
        video-mode = <2>;

        port {
          panel_in: endpoint {
            remote-endpoint = <&dsi_out>;
          };
        };
      };

      ports {
        #address-cells = <1>;
        #size-cells = <0>;

        port@0 {
          #address-cells = <1>;
          #size-cells = <0>;
          reg = <0>;

          mipi_dsi_to_display_pixel_link0: endpoint@0 {
            reg = <0>;
            remote-endpoint = <&display_pixel_link0_to_mipi_dsi>;
          };
        };

        port@1 {
          reg = <1>;

          dsi_out: endpoint {
            remote-endpoint = <&panel_in>;
          };
        };
      };
    };
