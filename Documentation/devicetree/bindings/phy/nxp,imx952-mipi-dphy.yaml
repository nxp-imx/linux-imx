%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/nxp,imx952-mipi-dphy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX952 MIPI DPHY

maintainers:
  - Liu Ying <victor.liu@nxp.com>

properties:
  compatible:
    const: nxp,imx952-mipi-dphy

  reg:
    maxItems: 1

  "#clock-cells":
    const: 0

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: apb
      - const: cfg
      - const: ref

  nxp,blk-ctrl:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      A phandle referencing the block control that controls MIPI DPHY and MIPI
      DPHY PLL.

  "#phy-cells":
    const: 0

  power-domains:
    maxItems: 1

additionalProperties: false

examples:
  - |
    phy@4b110000 {
        compatible = "nxp,imx952-mipi-dphy";
        reg = <0x4b110000 0x40000>;
        #clock-cells = <0>;
        clocks = <&scmi_clk 81>, <&scmi_clk 79>, <&scmi_clk 79>;
        clock-names = "apb", "cfg", "ref";
        nxp,blk-ctrl = <&display_dsi_csr>;
        #phy-cells = <0>;
        power-domains = <&scmi_devpd 11>;
    };
