%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/nxp,imx-cm0p-rproc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX CM0+ Co-Processor

description:
  This binding provides support for ARM Cortex M0+ Co-processor found on some NXP iMX SoCs.

maintainers:
  - Robert Chiras <robert.chiras@nxp.com>

properties:
  compatible:
    const: nxp,imx952-cm0p-rproc

  clocks:
    minItems: 1
    maxItems: 3

  clock-names:
    items:
      - const: cm0p
      - const: ocram
      - const: lpspi
    minItems: 1

  memory-region:
    description:
      A phandle for a reserved memory area that will be used for loading the firmware
      binary blob into, before booting the remote processor. Preferably, an OCRAM.
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 8

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: |
      Default name of the firmware to load to the remote processor.

  nxp,cm0p-ctrl:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to syscon CSR which provide access to CM0 control block.

  nxp,ocram-ctrl:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to syscon CSR which provide access to OCRAM control block.

  nxp,ocram-cfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to syscon CSR which provide access to OCRAM configuration block.

required:
  - compatible
  - nxp,cm0p-ctrl
  - nxp,ocram-cfg
  - clocks
  - clock-names
  - power-domains
  - memory-region

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/nxp,imx952-clock.h>
    #

    ld_fw: remoteproc {
      compatible = "nxp,imx952-cm0p-rproc";
      nxp,cm0p-ctrl = <&dispmix_cm0p_csr>;
      nxp,ocram-ctrl = <&dispmix_csr>;
      nxp,ocram-cfg = <&ocram_d_config>;
      firmware-name = "imx9xm0p_ld_fw.bin";
      clocks = <&dispmix_cm0p_csr IMX952_CLK_CM0P_GATE_SEL>,
               <&scmi_clk 188>,
               <&scmi_clk 77>;
      clock-names = "cm0p", "ocram", "lpspi";
      assigned-clocks = <&scmi_clk 77>;
      assigned-clock-parents = <&scmi_clk 10>;
      assigned-clock-rates = <20000000>;
      power-domains = <&scmi_devpd 11>;
      memory-region = <&ocram_d>;
    };
...
